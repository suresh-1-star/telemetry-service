name: Build and Push Telemetry API

on:
  push:
    branches: [main]

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: telemetry-api
  AWS_ACCOUNT_ID: "045064752559"

jobs:
  build-push-promote:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS Credentials File
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        run: |
          mkdir -p ~/.aws
          printf "[default]\naws_access_key_id = %s\naws_secret_access_key = %s\n" "$AWS_ACCESS_KEY_ID" "$AWS_SECRET_ACCESS_KEY" > ~/.aws/credentials
          aws sts get-caller-identity

      - name: Login to Amazon ECR & Push Image
        env:
          REGISTRY: ${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com
          IMAGE_TAG: ${{ github.sha }}
        run: |
          aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin $REGISTRY
          
          # Build and tag image with Commit SHA and latest
          docker build -t $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG -t $REGISTRY/${{ env.ECR_REPOSITORY }}:latest .
          
          # Push both tags
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG
          docker push $REGISTRY/${{ env.ECR_REPOSITORY }}:$IMAGE_TAG

      - name: Update GitOps Manifest Repository
        env:
          IMAGE_TAG: ${{ github.sha }}
          GITOPS_PAT: ${{ secrets.GITOPS_PAT }}
          GITOPS_REPO: "suresh-1-star/eks-gitops-manifests"
        run: |
          git clone https://x-access-token:${GITOPS_PAT}@github.com/${{ env.GITOPS_REPO }}.git gitops-repo
          cd gitops-repo
          
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          
          MANIFEST_FILE="Kubernetes/telemetry/deployment.yaml"
          NEW_IMAGE="${{ env.AWS_ACCOUNT_ID }}.dkr.ecr.${{ env.AWS_REGION }}.amazonaws.com/${{ env.ECR_REPOSITORY }}:${IMAGE_TAG}"
          
          sed -i "s|image: .*${{ env.ECR_REPOSITORY }}:.*|image: ${NEW_IMAGE}|g" $MANIFEST_FILE
          
          if git status --porcelain | grep -q "$MANIFEST_FILE"; then
            git add $MANIFEST_FILE
            git commit -m "chore(telemetry): promote image tag to ${IMAGE_TAG}"
            git push origin main
            echo "Successfully promoted image tag ${IMAGE_TAG} to GitOps repository."
          else
            echo "No manifest changes detected."
          fi    